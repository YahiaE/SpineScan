<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0a0a0a"/>
  <!-- Outer disc ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#10b981" stroke-width="18"/>
  <!-- Mid ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#10b981" stroke-width="10" opacity="0.5"/>
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="80" fill="none" stroke="#10b981" stroke-width="8" opacity="0.35"/>
  <!-- Centre hole -->
  <circle cx="256" cy="256" r="28" fill="#10b981"/>
  <circle cx="256" cy="256" r="14" fill="#0a0a0a"/>
  <!-- Spine lines suggesting CD text -->
  <line x1="96" y1="256" x2="160" y2="256" stroke="#10b981" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <line x1="352" y1="256" x2="416" y2="256" stroke="#10b981" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
</svg>
