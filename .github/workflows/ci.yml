name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FLASK_SECRET_KEY: test-only-flask-secret
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SECRET_KEY: test-only-supabase-secret
      REDIS_URL: redis://127.0.0.1:6379
      DISCOGS_SYNC_LOOKUP_ENABLED: "false"
      CAPTURE_SIGNATURE_SECRET: test-only-capture-secret
      GEMINI_API_KEY: test-only-gemini-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: pytest --cov=backend --cov-report=term-missing --cov-report=xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: false
