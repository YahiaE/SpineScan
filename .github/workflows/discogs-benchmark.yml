name: Live Discogs benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-discogs-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run live lookup benchmark
        env:
          CONSUMER_KEY: ${{ secrets.DISCOGS_CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.DISCOGS_CONSUMER_SECRET }}
          DISCOGS_BENCHMARK_ACCESS_TOKEN: ${{ secrets.DISCOGS_BENCHMARK_ACCESS_TOKEN }}
          DISCOGS_BENCHMARK_ACCESS_TOKEN_SECRET: ${{ secrets.DISCOGS_BENCHMARK_ACCESS_TOKEN_SECRET }}
          DISCOGS_BENCHMARK_USERNAME: ${{ secrets.DISCOGS_BENCHMARK_USERNAME }}
          SUPABASE_URL: ${{ secrets.SPINE_SCAN_BENCHMARK_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SPINE_SCAN_BENCHMARK_SUPABASE_SECRET_KEY }}
          SPINESCAN_BENCHMARK_ALLOW_DATABASE_WRITES: ${{ vars.SPINE_SCAN_BENCHMARK_DATABASE_CONFIRMATION }}
          REDIS_URL: redis://localhost:6379/0
          DISCOGS_AUTH_RPM: "60"
          DISCOGS_LOOKUP_MAX_CALLS_PER_ALBUM: "3"
          DISCOGS_LOOKUP_MAX_QUERY_STRATEGIES: "2"
          DISCOGS_LOOKUP_MAX_PAGES_PER_QUERY: "1"
          DISCOGS_MAX_RETRIES: "2"
        run: >-
          python tests/performance/benchmark_discogs.py
          --miss-iterations 4
          --hit-iterations 10
